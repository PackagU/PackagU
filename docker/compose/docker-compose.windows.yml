services:
  ros2:
    image: ${PACKAGU_DEV_IMAGE:-packagu/ros2-humble-slam:humble}
    container_name: ros2_humble
    environment:
      - DISPLAY=host.docker.internal:0.0
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - ${PACKAGU_SRC:-../../src}:/ros2_ws/src:rw
      - ${PACKAGU_MAPS:-../../src/slam_pkg/maps}:/ros2_ws/maps:rw
      - ${PACKAGU_INTEGRATION_WS:-../../integration}:/ros2_ws/integration:rw
      - ${PACKAGU_SCRIPTS:-../../scripts}:/ros2_ws/scripts:ro
    stdin_open: true
    tty: true
    restart: unless-stopped
