# 실물 택배 자동 집기 시험 설정 (팔 카메라 + ArUco 시트, 전방 초음파 없음).
# [가정값] = 실측 전 값. 현장에서 재서 바꾼다. [teach] = teach 결과가 덮어쓴다. 단위 m, deg, s.
source: "2026-10-30 실기 시험용. 치수·장착 위치는 가정값(줄자 실측 필요)"

vision:
  mode: tape               # tape = 받침 앞면 좌우 검정 표식 2개(2026-10-31). pallet = 구멍 줄(10/30, 비교·복구용 보존), marker = ArUco 시트
                           # tape 에서 인식이 안 돼도 구멍 모드로 넘어가지 않는다. 보정 파일도 따로(teach_tape.json)

tape:                      # 검정 표식 2개: 받침 앞면 왼쪽·오른쪽 다리, 흰 테이프 바탕 위 무광 검은 테이프(같은 높이·대칭)
  center_spacing_m: 0.34   # [실측 10/31] 두 검정 표식 "중심 ↔ 중심" 간격 34 cm(왼쪽 끝 → 왼쪽 끝). 영상 비율 추정 33.8 cm 와 맞음
                           # row_length_m·hole_pitch_m 과 무관. calibrate 는 이 값을 바꾸지 않는다
  marker_center_height_m: 0.08   # [실측 10/31] 바닥 → 검정 표식 중심 높이 8 cm. 계산에는 (camera_height_m - 이 값)만 쓴다
  camera_height_m: 0.595   # [대략 실측 10/31] 보기 자세 B 바닥 → 렌즈 가운데 59~60 cm(10/30 추정 0.48 은 틀림)
  camera_roll_deg: 0.0     # [가정값] 보기 자세 카메라 roll. 1° 틀리면 받침 각도(yaw)가 약 1.7~2.8° 틀린다(거리 0.5~1 m)
  pocket_left_m: 0.0       # 두 표식 가운데가 포켓 중심선보다 (로봇에서 볼 때) 왼쪽이면 +. 대칭 부착이면 0
  marker_size_m: [0.032, 0.016]   # [실측 10/31] 검정 가로 3.2 × 세로 1.6 cm. 기록용(계산은 중심 두 점만 쓴다)
  # 검출(10/31 낮 실제 프레임으로 맞춤: 검정 5~30, 흰 띠 200~250, 흰 테두리 대비 150~215)
  block_px: 51             # 주변 밝기 평균 창
  dark_offset: 45          # 주변 평균보다 이만큼 어두우면 검정 후보
  black_max: 110           # 검정 후보 밝기 상한(0~255)
  min_area_px: 60          # 표식 넓이 하한(약 1.5 m). 너무 작으면 거부
  max_area_px: 6000
  min_short_px: 5
  min_marker_short_px: 6   # 짧은 변이 이보다 작으면 "too small"(너무 멂)
  max_aspect: 4.0          # 긴 변/짧은 변 상한(바닥 틈·가는 그림자 제외)
  min_fill: 0.72           # 덩어리 넓이 / 회전 외접 사각형 넓이
  min_border_contrast: 100 # 마주 보는 두 변 바깥(흰 테두리)이 검정보다 이만큼 밝아야 함. 가구 아래 그림자는 약 80
  min_side_contrast: 35    # 네 변 모두 검정보다 이만큼 밝아야 함(어두운 면과 이어진 덩어리 제외)
  min_white_excess: 20     # 흰 테두리가 주변 장면 평균(block_px 창)보다 이만큼 밝아야 함. 바닥 옹이·그림자는 약 0
  max_area_ratio: 2.0      # 두 표식 넓이 비 상한(원근: 30° 비스듬해도 약 1.8)
  max_aspect_ratio_diff: 1.6
  max_pair_tilt_deg: 20    # 두 중심을 잇는 선 기울기 상한(같은 높이, yaw 20° 에서 약 9°)
  min_spacing_px: 40
  spacing_to_size: [3.0, 30.0]   # 중심 간격 px / 표식 크기 px 허용 범위(실측 크기 없어서 넓게)
  center_sigma_px: 0.3     # 중심 화소 잡음 가정(10/31 정지 20장: 약 0.15 px)
  max_heading_sigma_deg: 1.0     # 그 잡음으로 yaw 가 이보다 흔들리는 배치는 거부(0° 로 채우지 않음)
  look:                    # 이 모드의 한 번 보기(중앙값) 허용 흔들림. camera 절 값보다 우선
    max_spread_m: 0.02     # 좌우: 중앙값 ±10 mm 안 프레임이 3/4 이상(10/31 정지 20장: 2 mm)
    max_spread_deg: 1.5    # yaw: 중앙값 ±0.75°(10/31 정지 20장: 0.1°)
    max_jump_px: 3.0       # 표식 중심이 중앙값에서 이보다 튄 프레임은 버림(3/4 미만 남으면 거부)
  align:                   # 이 모드의 정렬 허용치(align 절보다 우선). 표식 yaw 흔들림이 약 0.1° 라 구멍 모드(1.5°)보다 좁힘
    yaw_tol_deg: 1.0       # 삽입 약 0.6 m 동안 1° → 포크 끝 약 10 mm 휩쓸림
  insert:                  # 이 모드의 삽입 설정(insert 절보다 우선)
    correct_yaw_deg: 0.5   # 삽입 중 카메라로 볼 때마다 각도가 이보다 크면 제자리 회전으로 0 에 맞춤(카메라 없는 마지막 구간 대비)
  calibrate:
    max_focal_change: 0.15        # 움직여서 맞춘 초점 배율이 1 ± 이 값 밖이면 정지(간격·화각 가정이 틀림)
    max_fit_rms_m: 0.008          # 12 cm 후진·전진 이동 맞춤 잔차 상한
    max_heading_change_deg: 1.5   # 직진 후진·전진인데 카메라 yaw 가 이보다 바뀌면 정지(yaw 불안정 또는 바퀴 틀어짐)
    max_tape_motion_disagree: 0.10   # --camera-distance(줄자) 배율과 12 cm 이동 맞춤 배율 차이 상한. 줄자 값이 기준이고 이동 맞춤은
                                     # 큰 착오(간격·줄자 위치 잘못)만 잡는다. 이동 맞춤은 오프라인에서 ±3~5 % + odom 미끄럼(10/31)

pallet:                    # 구멍 뚫린 알루미늄 앵글 받침. 포크는 가로대 아래로 들어간다
  post_spacing_m: 0.305    # 사용자 실측 "두 기둥 사이 간격 30.5 cm" — 기둥 중심 간격으로 가정(안쪽/바깥쪽이면 고칠 것)
  row_height_m: 0.06       # 사용자 실측 6 cm. 가로대 앞면 구멍 줄 높이로 사용 [가정: 구멍 줄 ≈ 가로대 높이]
  hole_polarity: bright    # 낮(10/31): 구멍 너머 바닥이 밝아 큰 타원 구멍만 보임. 밤(10/30)은 dark. auto = 둘 다 시도
  row_length_m: 0.31       # 가로대 구멍 줄 양 끝 구멍 사이 길이(거리 계산의 기준). calibrate 가 움직여서 맞춘다(10/31)
  hole_pitch_m: 0.020      # row_length_m 이 없을 때만 씀(개수 × 간격). 낮에는 개수가 흔들려 쓰지 않는다
  bar_max_gap_px: 40       # 구멍 몇 개가 안 잡혀도 한 줄로 잇는 간격
  camera_height_m: 0.48    # 보기 자세(B) 카메라 렌즈 높이(10/30 움직여서 맞춘 값). calibrate 가 다시 맞춘다
  camera_roll_deg: 0.0
  min_bar_holes: 8
  min_bar_span_px: 80
  min_post_holes: 4
  post_end_tolerance_px: 70   # 가로대 구멍 줄 끝 ±이만큼에서 기둥 테두리 쌍을 찾는다

marker:
  dictionary: DICT_4X4_50
  size_m: 0.080            # 인쇄 후 자로 확인(배율 100%). 시뮬과 같은 id 23·24
  ids: [23, 24]            # 로봇에서 볼 때 왼쪽 23, 오른쪽 24
  center_x_m: [-0.080, 0.080]   # 시트 중심선(= 포켓 중심선) 기준 마커 중심 좌우 위치
  pocket_left_m: 0.0       # 시트 중심선이 포켓 중심선보다 (로봇에서 볼 때) 왼쪽에 있으면 +. 중심에 붙이면 0
  require_both: true       # 평면 시트의 각도 모호성 때문에 두 마커가 다 보여야 유효

camera:
  device: 0                # /dev/video0 (Generic USB2.0 PC CAMERA, 팔 카메라)
  width: 640
  height: 480
  hfov_deg: 40.0           # [역산 10/31] 60° 가정이면 바퀴 1.2 m 배치(렌즈 1.12 m)를 0.58 m 로 봄. 같은 영상에서 39.7° 가 1.116 m.
                           # calibrate(--camera-distance·12 cm 이동)가 focal_scale 로 다시 맞춘다
  calibration_file: ""     # 체커보드 보정 결과(json: k 9개, d)가 있으면 이것을 쓴다
  max_age_s: 0.5           # 이보다 오래된 프레임·인식값은 쓰지 않는다
  min_frames: 12           # 한 번 볼 때 모을 유효 인식 수. 낮 밝은 구멍은 프레임마다 좌우 ±20 mm 흔들려(10/31 실기) 중앙값으로 누른다
  acquire_timeout_s: 6.0   # 이 안에 못 모으면 영상 유실로 보고 정지
  max_reprojection_px: 2.5
  max_spread_m: 0.05       # 중앙값 ± 이 값의 절반(25 mm) 안 프레임이 3/4 이상이어야 통과. 포켓 한쪽 여유 약 90 mm. 25 mm 는 10/31 실기에서 거부됨
  max_spread_deg: 2.5
  http_port: 8093          # 인식 화면 http://<JETSON>:8093

robot:                     # 로봇 기준: x 전방, y 왼쪽. 원점 = 두 바퀴 축 중심(회전 중심)
  camera_forward_m: 0.08   # [대략 실측 10/31] 구동 바퀴 가운데 → 렌즈 약 8 cm 앞(포크 끝 30 − 렌즈↔포크 끝 22). 10/30 회전 시험 추정 0.34 는 틀림
  camera_left_m: -0.11     # [현장 10/31] 렌즈는 포크 중심보다 오른쪽 약 11 cm. 포크 중심=바퀴 중심선은 가정(docs/hardware_spec.md 1.5)
  camera_yaw_deg: 0.0      # 카메라가 로봇 정면에서 돌아간 각도(팔 받침 관절 1500 = 정면 가정)
  calibrate_camera_yaw: false   # true 면 calibrate 의 후진·전진으로 잼(10/30 실기에서 12° 오차라 끔)
  fork_center_left_m: 0.0  # [가정값] 포크 중심선이 회전 중심보다 왼쪽이면 +
  fork_tip_forward_m: 0.30 # [대략 실측 10/31] 구동 바퀴 가운데 → 포크 끝 약 30 cm. 순서 바퀴 → 렌즈 → 포크 끝

arm:
  enabled: true
  port: /dev/arm_servo
  views_file: src/robot_arm_pkg/config/camera_views.json   # Jetson 현장값을 그대로 읽는다
  view: pickup_view        # views_file 에 없으면 아래 view_pose 를 쓴다
  view_pose: {"000": 1500, "001": 1470, "002": 2470, "003": 1570}   # 2026-11-03 강의실: 같은 관절값에서 카메라가 192호보다 약 20° 위를 봐서(B 13.5°) 어깨만 내림(60 당 약 7°). 이전 10/30 B: 001 1300
  stow_file: apps/button_arm_test/servo_reference.py      # 그 파일의 HOME(현장 home)을 수납 자세로
  move_ms: 2000
  settle_s: 0.8
  tolerance_pwm: 30
  keep_view_while_driving: true    # 10/30 실기: 보기 자세 B 를 주행 중에도 유지(재현성). 상승 직전에만 수납

base:
  container: ros2_humble
  turn_speed_rad_s: 0.15   # 소각 회전 후 관성 넘침을 줄이는 집기용 저속
  align_speed_m_s: 0.06
  insert_speed_m_s: 0.03
  retreat_speed_m_s: 0.04
  max_turn_deg: 100
  allow_idle_nav2: true     # Nav2 가 켜져 있어도 목표 없이 쉬면(점검 동안 /cmd_vel 0개) 집기 이동 허용 — 192호 E2E 2026-11-01

align:
  lateral_tol_m: 0.012     # 포켓 폭 320 - 포크 폭 140 = 한쪽 여유 90 mm [가정 치수]. 정렬 12 mm + 삽입 중 흔들림 → 최종 15 mm 이내 목표
  yaw_tol_deg: 1.5         # 삽입 400 mm 동안 1.5° → 끝 휩쓸림 약 10 mm. 최종 2° 이내 목표
  distance_tol_m: 0.03
  max_path_angle_deg: 12   # 좁은 카메라 시야를 유지하도록 작은 대각선 보정
  max_iterations: 10
  autonomous_view: true   # Jetson에서 목표 연속성·시야 복구·관찰 거리 계산
  visibility_margin_px: 64
  max_view_recoveries: 3
  view_recovery_deg: 3
  lateral_gain: 0.5        # [실기 10/31] 장착 좌우 -11 cm 반영 후에도 작은 보정·재관찰로 진행(첫 이동 ratio 1.867)
  center_tol_deg: 4.0      # calibrate 전에 받침 방향이 이보다 벌어지면 제자리 회전으로 화면 가운데에 둔다
  look_back_m: 0.15        # 정렬을 predock 보다 이만큼 뒤(받침이 화면에 확실히 보이는 곳)에서 끝내고 남은 거리는 삽입이 간다(10/31 시뮬)
  look_distance_tol_m: 0.08   # look point 앞뒤 허용. 삽입 시작 때 카메라로 남은 거리를 다시 잰다
  realign_lateral_m: 0.035 # 삽입 중 이보다 벗어나면 정지 → predock 으로 후진 → 재정렬
  realign_yaw_deg: 4.0
  odom_vision_disagree_m: 0.05   # 전진 거리(odom)와 카메라 거리 차이가 이보다 크면 정지

insert:
  depth_m: 0.15            # [가정값] 포크를 포켓 입구에서 더 밀어 넣을 깊이
  gap_m: 0.30              # predock 에서 포크 끝 ↔ 가로대 거리. 0.20 이면 보기 자세 B 에서 가로대가 화면 아래로 빠짐(10/30)
  segment_m: 0.12          # 이만큼 갈 때마다 멈춰서 다시 본다
  blind_final_m: 0.50      # 남은 삽입 거리가 이보다 짧으면 카메라로 다시 보지 않는다(= 받침이 보이는 한계). 그보다 멀 때 본 결과가 없으면 가림으로 보고 정지
  distance_tol_m: 0.01
  max_total_m: 0.90        # 카메라로 계산한 남은 삽입 거리가 이보다 길면 정지(잘못 본 것)
  confirm_before_lift: true   # 상승 전에 사람이 눈으로 삽입을 확인(첫 실기 시험)

front_range:               # 몸체 전방 초음파(별도 보드, firmware/body_ultrasonic). 미장착이면 false
  enabled: false
  port: ""                 # /dev/serial/by-id/... (115200, 'US distance_cm=<cm>')
  stale_s: 0.5
  stop_cm: null            # 완전 삽입 때 읽히는 거리(현장 실측 cm). null 이면 마지막 구간 시작 값 - 남은 거리
  max_disagree_m: 0.05     # 초음파로 잰 이동과 odom 이동 차이 상한

lift:
  port: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A5069RR4-if00-port0
  up_timeout_s: 15

retreat:
  distance_m: 0.35

straight:                  # 직진 전용 집기(straight_pickup.py, 2026-10-31). 회전·후진 재정렬 없음 — 벗어나면 그 자리에서 정지
  insert_depth_m: 0.20     # 포크 끝이 앞면(표식 면)을 지나 들어갈 깊이. 10/31 밤 실기 0.152 m(추정) 삽입 뒤 사용자 "5 cm 더 앞이면 딱 좋음"
  record_hz: 4.0           # 기준 관측부터 끝날 때까지 카메라 원본 화면을 이 주기로 저장(run_dir/frames, index.csv)
  speed_m_s: 0.05          # 직진 속도(실제 odom 으로 거리 계산). 11/1 사용자 "무조건 빨리" 0.03→0.05
  retreat_speed_m_s: 0.05
  segment_m: 0.15          # 두 표식이 보이는 동안 이만큼 갈 때마다 다시 본다
  view_margin_px: 24       # 다음 관측에서 두 표식이 화면 가장자리에서 이만큼 안쪽이어야 다시 본다(아니면 마지막 구간)
  max_reference_lateral_m: 0.04   # 팔레트 중심이 포크 중심선에서 이보다 벗어나면 정지(수동 재정렬 요청)
  max_reference_roll_deg: 8.0     # 정면 배치(앞면 기울기 0)로 역산한 카메라 roll 상한
  lateral_change_m: 0.02   # 기준 대비 팔레트 중심 좌우 변화 허용(odom 좌우 이탈 반영 후)
  face_yaw_deg: 4.0        # 기준 roll 로 계산한 앞면 기울기 변화 허용(odom yaw 반영 후) — 2026-11-03 강의실 1f: 어깨 1470 자세에서 접근 0.3 m 에 2.62°(측정 틀어짐, 접촉 전). 이전 2.5
  distance_disagree_m: 0.04       # 영상 거리 변화 vs 실제 odom 전진 차이 허용(+ 이동의 4 %)
  odom_vision_scale: [0.90, 1.18] # 영상/odom 거리 비. 밖이면 정지, 안이면 마지막 구간 odom 명령 보정(10/31 밤 실기 1.043~1.058) — 2026-11-03 강의실 1f: 1.054(15 cm)·1.096(30 cm), 카메라 높이 변경 탓. 이전 [0.92, 1.08]
  move_max_yaw_deg: 1.0    # 한 번 이동 중 odom yaw 변화 한도(helper 가 즉시 0 출력)
  move_max_lateral_m: 0.015
  total_max_yaw_deg: 1.5   # 기준부터 누계 한도
  total_max_lateral_m: 0.02
  max_blind_m: 0.95        # 카메라 없이 가는 마지막 구간 상한
  final_tolerance_m: 0.015 # 마지막 구간 odom 실제 이동 vs 명령 차이 한도
  min_total_m: 0.10
  max_total_m: 1.30
  rear_margin_m: 0.40      # 후진 거리 + 이만큼 뒤가 라이다로 비어 있어야 함
  min_camera_fps: 5.0
  min_scan_hz: 5.0
  min_odom_hz: 20.0
  max_fixed_roll_face_yaw_deg: 1.5   # 저장된 roll 로 본 앞면 기울기 허용(정렬 모드·roll 지정 시)
  bearing_tol_deg: 8.0     # 숫자 모드: 정면 자세에서 숫자가 보인 방향과 팔레트 방향 차이 허용
  label_frames: 8          # 숫자 판독에 모을 새 프레임 수
  label_timeout_s: 8.0
  label_min_frames: 3      # 이 장 수 이상 같은 숫자가 읽혀야 인정
  label_tilts: [0.35, 0.5, 0.2, 0.7, 1.0]   # 숫자 찾기: B 에서 정면(1) 쪽으로 기울이며 읽는다. 2026-11-03 강의실: 1.2 m 앞 송장은 B 보다 약 20° 위(0.35 부근)에서 보임. 이전(192호) [0.7, 1.0, 0.5, 0.35, 0.2]
  view_pitch_deg: 35.0     # 보기 자세 B 의 아래 보기 각(실측 35.5~35.9°)
  search_tilts: [0.0, 0.15, 0.3, 0.45, -0.15]   # 택배 모드: 보기 자세 B 에서 택배 팔레트가 안 보이면 팔을 B↔정면 사이로 기울여 찾는다(0=B, 1=정면, 음수=더 아래)
  align_robot_to_face_m: 1.20     # 정렬 목표: 바퀴 축 → 앞면 거리(두 표식이 보이는 거리)
  align_lateral_m: 0.012
  align_yaw_deg: 1.0
  align_distance_tol_m: 0.08
  align_max_path_deg: 25
  align_max_back_m: 0.55   # 2026-11-03 강의실: 시작 자세가 402 팔레트 축에서 19 cm 옆·1.11 m 라 0.50 m 후진 필요(뒤 라이다 1.35 m). 이전 0.30
  align_max_turn_deg: 40
  align_max_iterations: 5
  align_min_tip_to_face_m: 0.60   # 포크 끝이 앞면에서 이보다 가까우면 회전 금지
  align_speed_m_s: 0.04
  align_move_max_yaw_deg: 2.0     # 정렬 중 직진의 yaw 한도(회전 직후 잔여 흔들림 허용)

lift_carry:                # 삽입 뒤 상승·운반(straight_pickup.py). 보드 완료 응답이 아니라 초음파 거리로 판정
  front_view: front_view   # 상승 전 팔 자세(camera_views.json 키, 현장 값) — 사용자 지시: 정면을 보는 자세(이후 버튼 누르기)
  settle_s: 1.0
  max_up_commands: 10      # u(12800 펄스) 반복 상한. 초음파 정지가 없으면 여기서 멈추고 후진하지 않는다
                           # 10/31 밤 실기: u 3회 완료 뒤 4번째 약 3.1 s 에 보드 재부팅(초음파 정지 없음). 사용자 확인: 팔레트 뜸·이상 없음
  stop_distance_cm: 10.0   # 몸체 상단 정면 초음파: 상자가 올라와 이 거리 미만이면 보드가 상승 정지(사용자 설계)
  up_timeout_s: 15
  nominal_pulse_s: 0.00033 # 펄스 1개 시간 추정(HIGH 10 + LOW 302 µs + 확인 부담). 완료된 u 가 있으면 실측으로 갱신
  min_image_change: 4.0    # 상승 전후 정면 영상 평균 밝기 차 — 보조 근거(기록·경고만)
  expected_banner: ["Motor ready", "u: Up (ultrasonic stop)", "d: Down (no ultrasonic stop)",
                    "Sensor: Up only; No echo does not stop Up", "Up stop distance: 10.0 cm"]

limits:
  max_retries: 2           # 삽입 중 재정렬 횟수
  total_timeout_s: 600
